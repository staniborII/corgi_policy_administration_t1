[project]
name = "corgi-backend"
version = "0.1.0"
description = "Corgi Policy Administration Backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "dj-database-url>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
    "django-cors-headers>=4.9.0",
    "requests>=2.34.2",
    "stripe>=15.6.1",
    "reportlab>=5.0.1",
    "mcp[cli]>=1.0,<2.0",
    "boto3>=1.35,<2.0",
    "gunicorn>=23.0,<24.0",
    "channels[daphne]>=4.2,<5.0",
    "channels-redis>=4.2,<5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
